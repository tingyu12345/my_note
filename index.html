<meta charset="UTF-8">
<title>我的筆記站</title>
<meta name="description" content="個人筆記與紀錄總覽">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #f7f1e4;
    --paper: #fffcf5;
    --ink: #2b2019;
    --ink-soft: #6e5c4c;
    --ink-faint: #a3937f;
    --accent: #a8291f;
    --gold: #a67c2e;
    --gold-soft: #cfa94f;
    --line: #ddccab;
    --shadow: rgba(60, 40, 20, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b140f;
      --paper: #241b14;
      --ink: #f1e6d6;
      --ink-soft: #c7b6a0;
      --ink-faint: #8a7a65;
      --accent: #e2574a;
      --gold: #e0b968;
      --gold-soft: #f0d190;
      --line: #4a3c2c;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #1b140f;
    --paper: #241b14;
    --ink: #f1e6d6;
    --ink-soft: #c7b6a0;
    --ink-faint: #8a7a65;
    --accent: #e2574a;
    --gold: #e0b968;
    --gold-soft: #f0d190;
    --line: #4a3c2c;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding-inline: 20px;
    padding-block: 48px 64px;
    line-height: 1.7;
  }

  .wrap {
    max-width: 760px;
    margin-inline: auto;
  }

  .masthead {
    text-align: center;
    margin-bottom: 48px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .eyebrow::before, .eyebrow::after {
    content: "";
    width: 22px;
    height: 1px;
    background: var(--gold-soft);
  }

  h1 {
    font-family: "Noto Serif TC", serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 42px);
    text-wrap: balance;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 46ch;
    margin: 0 auto;
  }

  .section-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 0.04em;
    margin: 40px 0 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--line);
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    display: block;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 1px 2px var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .card:hover {
    border-color: var(--gold);
    transform: translateY(-1px);
  }

  .card-title {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 16.5px;
    margin: 0 0 6px;
    color: var(--ink);
  }

  .card-desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0;
  }

  .empty-note {
    font-size: 13.5px;
    color: var(--ink-faint);
    font-style: italic;
  }

  footer {
    text-align: center;
    margin-top: 56px;
    font-size: 12px;
    color: var(--ink-faint);
    font-family: "JetBrains Mono", monospace;
  }

  @media (max-width: 600px) {
    body { padding-inline: 14px; padding-block: 32px 48px; }
    .masthead { margin-bottom: 32px; }
    .section-label { margin: 32px 0 12px; }
    .card { padding: 14px 14px; }
    .card-title { font-size: 15.5px; }
    .card-desc { font-size: 13px; }
  }
</style>

<div class="wrap">

  <div class="masthead">
    <span class="eyebrow">Notes Index</span>
    <h1>我的筆記站</h1>
    <p class="subtitle">生活儀式、專案紀錄與各種筆記的總覽入口</p>
  </div>

  <div class="section-label">筆記 Notes</div>
  <div class="card-list">
    <a class="card" href="notes/ruzhu-yishi.html">
      <p class="card-title">入厝儀式時程表</p>
      <p class="card-desc">入厝前三天至當天的完整時間流程，一人極簡版本，含煮湯圓儀式</p>
    </a>
  </div>

  <div class="section-label">專案 Projects</div>
  <p class="empty-note">尚無內容，之後新增專案頁面會列在這裡。</p>

  <footer>my_note · GitHub Pages</footer>

</div>
